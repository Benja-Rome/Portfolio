<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Portfolio</title>
		<link rel="stylesheet" href="./css/style.css" />
		<link rel="stylesheet" href="https://unpkg.com/98.css" />
		<script src="./js/script.js" defer></script>
	</head>
	<body>
		<div class="wrapper">
			<div class="left miti">
				<div class="window info">
					<div class="title-bar">
						<div class="title-bar-text">Quién soy</div>
						<div class="title-bar-controls">
							<button aria-label="Minimize"></button>
							<button aria-label="Maximize" disabled></button>
							<button aria-label="Close"></button>
						</div>
					</div>
					<div class="window-body">
						<p>
							¡Hola! Me llamo Benjamín Romero, tengo 16 años y me
							gusta la compu
						</p>
					</div>
				</div>

				<div class="window videojuegos">
					<div class="title-bar">
						<div class="title-bar-text">Mis Videojuegos</div>
						<div class="title-bar-controls">
							<button aria-label="Minimize"></button>
							<button aria-label="Maximize" disabled></button>
							<button aria-label="Close"></button>
						</div>
					</div>
					<div class="window-body"></div>
				</div>

				<div class="window musica">
					<div class="title-bar">
						<div class="title-bar-text">Mi Música</div>
						<div class="title-bar-controls">
							<button aria-label="Minimize"></button>
							<button aria-label="Maximize" disabled></button>
							<button aria-label="Close"></button>
						</div>
					</div>
					<div class="window-body">
						<p>
							¡Acá podés poner tus álbumes o artistas favoritos!
						</p>
					</div>
				</div>
			</div>

			<div class="right miti">
				<div class="window mifoto">
					<div class="title-bar">
						<div class="title-bar-text">Mi foto :)</div>
						<div class="title-bar-controls">
							<button aria-label="Minimize"></button>
							<button aria-label="Maximize" disabled></button>
							<button aria-label="Close"></button>
						</div>
					</div>
					<div class="window-body pfp">
						<img src="./img/pfp.jpg" alt="yo" class="pfp" />
					</div>
				</div>

				<div class="window memes eminem">
					<div class="title-bar">
						<div class="title-bar-text">?</div>
						<div class="title-bar-controls">
							<button aria-label="Minimize"></button>
							<button aria-label="Maximize" disabled></button>
							<button aria-label="Close"></button>
						</div>
					</div>
					<div class="window-body memesimg">
						<img
							src="./img/eminem-confused.jpg"
							alt="Eminem"
							class="memesimg"
						/>
					</div>
				</div>

				<div class="window memes gabe">
					<div class="title-bar">
						<div class="title-bar-text">Jesus GabeN</div>
						<div class="title-bar-controls">
							<button aria-label="Minimize"></button>
							<button aria-label="Maximize" disabled></button>
							<button aria-label="Close"></button>
						</div>
					</div>
					<div class="window-body memesimg">
						<img
							src="./img/GabeN.webp"
							alt="Gabe Newell Jesús"
							class="memesimg"
						/>
					</div>
				</div>

				<div class="window memes tux">
					<div class="title-bar">
						<div class="title-bar-text">The Working Tux</div>
						<div class="title-bar-controls">
							<button aria-label="Minimize"></button>
							<button aria-label="Maximize" disabled></button>
							<button aria-label="Close"></button>
						</div>
					</div>
					<div class="window-body memesimg">
						<img
							src="./img/tux.gif"
							alt="Tux is working, leave him alone"
							class="memesimg"
						/>
					</div>
				</div>
			</div>

			<div class="taskbar">
				<img
					src="./img/start.png"
					id="startButton"
					alt="windows 98 start button"
					class="start"
				/>
			</div>
		</div>
	</body>
</html>
